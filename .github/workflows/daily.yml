name: Daily Ranking

on:
  schedule:
    - cron: '05 07 * * *'
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run crawler
        env:
          GRAPHQL_API_URL: ${{ secrets.GRAPHQL_API_URL }}
          HEADER_KEY_VALUE_URL: ${{ secrets.HEADER_KEY_VALUE_URL }}
          PAYLOAD_DAILY_URL: ${{ secrets.PAYLOAD_DAILY_URL }}
          HEADER_KEY: ${{ secrets.HEADER_KEY }}
          COOKIE: ${{ secrets.COOKIE }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: python main.py
        timeout-minutes: 15     # 防止无限等待

      - name: Commit and push results
        if: success()           # 只有成功才执行
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git pull origin main --rebase || echo "Pull warning, continuing..."
          
          git add TOP/*.json
          
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update ranking $(date +%Y-%m-%d)"
            git push --force-with-lease
            echo "Successfully pushed updates."
          fi
