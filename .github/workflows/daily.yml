name: Daily Ranking

on:
  schedule:
    - cron: '05 07 * * *'
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0          # 重要：保证能正常 git pull
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          echo "Dependencies installed successfully"

      - name: Run crawler
        env:
          GRAPHQL_API_URL: ${{ secrets.GRAPHQL_API_URL }}
          HEADER_KEY_VALUE_URL: ${{ secrets.HEADER_KEY_VALUE_URL }}
          PAYLOAD_DAILY_URL: ${{ secrets.PAYLOAD_DAILY_URL }}
          HEADER_KEY: ${{ secrets.HEADER_KEY }}
          COOKIE: ${{ secrets.COOKIE }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: python main.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          echo "=== Current status before pull ==="
          git status
          
          git pull origin main --rebase || echo "Pull failed, continuing anyway..."
          
          git add TOP/*.json
          
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update ranking $(date +%Y-%m-%d)"
            echo "Changes committed"
          fi
          
          git push
          echo "Push completed"
