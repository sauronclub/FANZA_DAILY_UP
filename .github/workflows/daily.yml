name: Daily Ranking

on:
  schedule:
    - cron: '05 07 * * *'
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    # 推荐加上这个环境变量，强制使用 Node 24 并减少警告
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7     # ← 升级到 v7（推荐）

      - name: Setup Python
        uses: actions/setup-python@v6   # ← 升级到 v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run crawler
        env:
          GRAPHQL_API_URL: ${{ secrets.GRAPHQL_API_URL }}
          HEADER_KEY_VALUE_URL: ${{ secrets.HEADER_KEY_VALUE_URL }}
          PAYLOAD_DAILY_URL: ${{ secrets.PAYLOAD_DAILY_URL }}
          HEADER_KEY: ${{ secrets.HEADER_KEY }}
          COOKIE: ${{ secrets.COOKIE }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: python main.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase
          git add TOP/*.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update ranking $(date +%Y-%m-%d)"
          git push
