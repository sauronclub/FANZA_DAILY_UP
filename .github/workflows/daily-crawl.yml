name: Fanza Daily Crawl

on:
  schedule:
    - cron: '00 7 * * *'   # UTC 7:00
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: run
        env:
          FANZA_COOKIE: ${{ secrets.FANZA_COOKIE }}
          JP_IP_LIST_URL: ${{ vars.JP_IP_LIST_URL }}
          RANKING_URL: ${{ vars.RANKING_URL }}
          GQL_URL: ${{ vars.GQL_URL }}
          OUTPUT_ROOT: ${{ runner.temp }}/fanza
          MAX_WORKERS: ${{ vars.MAX_WORKERS }}
        run: |
          cd $GITHUB_WORKSPACE
          python -m pip install -r requirements.txt
          python -m src.main
