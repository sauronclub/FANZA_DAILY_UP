name: Fanza Daily Crawl

on:
  schedule:
    - cron: '00 7 * * *'   # UTC 7:00
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Create output directories
        run: |
          mkdir -p HTML DATE CID H1
      
      - name: Run crawler
        working-directory: ${{ github.workspace }}
        env:
          FANZA_COOKIE: ${{ secrets.FANZA_COOKIE }}
          JP_IP_LIST_URL: ${{ vars.JP_IP_LIST_URL }}
          RANKING_URL: ${{ vars.RANKING_URL }}
          GQL_URL: ${{ vars.GQL_URL }}
          OUTPUT_ROOT: ${{ github.workspace }}
          MAX_WORKERS: ${{ vars.MAX_WORKERS }}
        run: python -m src.main
      
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: fanza-${{ github.run_id }}
          path: |
            HTML/
            DATE/
            CID/
            H1/
          retention-days: 30
