name: Fanza Daily Crawl

on:
  schedule:
    - cron: '* 7 * * *'   # UTC 7:00
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: run
        working-directory: ${{ github.workspace }}
        env:
          FANZA_COOKIE: ${{ secrets.FANZA_COOKIE }}
          JP_IP_LIST_URL: ${{ vars.JP_IP_LIST_URL }}
          RANKING_URL: ${{ vars.RANKING_URL }}
          GQL_URL: ${{ vars.GQL_URL }}
          OUTPUT_ROOT: ${{ github.workspace }}
          MAX_WORKERS: ${{ vars.MAX_WORKERS }}
        run: python -m src.main
      - uses: actions/upload-artifact@v4
        with:
          name: fanza-${{ github.run_id }}
          path: ${{ github.workspace }}/fanza
          retention-days: 30
